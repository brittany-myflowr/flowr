<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shared on flowr</title>
  <meta name="description" content="A self-care routine shared with you on flowr." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="flowr" />
  <meta property="og:title" content="Shared on flowr" />
  <meta property="og:description" content="A self-care routine shared with you on flowr." />
  <meta property="og:image" content="https://myflowr.co/assets/app-store-icon.png" />
  <meta property="og:url" content="https://myflowr.co/shared-routine" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Shared on flowr" />
  <meta name="twitter:description" content="A self-care routine shared with you on flowr." />
  <meta name="twitter:image" content="https://myflowr.co/assets/app-store-icon.png" />
  <meta name="theme-color" content="#fafaf8" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon.png?v=4" />
  <link rel="apple-touch-icon" href="/assets/app-store-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Lora:ital,wght@1,700&display=swap" rel="stylesheet" />
  <script src="/config.js"></script>
  <style>
    :root {
      --navy: #1a1a2e;
      --blue: #7ba7c2;
      --bg: #fafaf8;
      --gray: #6b7280;
      --muted: #9ca3af;
      --white: #ffffff;
      --border: rgba(26, 26, 46, 0.22);
      --font: "DM Sans", system-ui, sans-serif;
      --logo: "Lora", Georgia, serif;
      --phone: 440px;
      --accent: #e8a0b0;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      color: var(--navy);
      background: #f3f1ec;
      line-height: 1.45;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    .atmosphere {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .atmosphere::before,
    .atmosphere::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
    }

    .atmosphere::before {
      width: min(70vw, 520px);
      height: min(70vw, 520px);
      top: -18%;
      right: -12%;
      background: radial-gradient(circle, #fceee0 0%, transparent 70%);
    }

    .atmosphere::after {
      width: min(55vw, 420px);
      height: min(55vw, 420px);
      bottom: 5%;
      left: -14%;
      background: radial-gradient(circle, rgba(158, 176, 212, 0.45) 0%, transparent 70%);
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(100% - 1.5rem, var(--phone));
      margin: 1.25rem auto 2rem;
      min-height: calc(100vh - 3.25rem);
      background: linear-gradient(180deg, #f7f0f2 0%, var(--bg) 30%, var(--bg) 100%);
      background: linear-gradient(
        180deg,
        color-mix(in srgb, var(--accent) 14%, var(--bg)) 0%,
        var(--bg) 28%,
        var(--bg) 100%
      );
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(26, 26, 46, 0.1);
      border-radius: 28px;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.7) inset,
        0 18px 50px rgba(26, 26, 46, 0.1);
      overflow: hidden;
      animation: rise 0.55s ease-out both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-bar {
      padding: 20px 20px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-bar a {
      font-family: var(--logo);
      font-style: italic;
      font-weight: 700;
      font-size: 20px;
      color: var(--navy);
      letter-spacing: -0.02em;
    }

    .brand-mark {
      width: 16px;
      height: 16px;
      color: var(--accent);
    }

    .brand-mark svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .header {
      padding: 22px 20px 16px;
      border-bottom: 1px solid rgba(26, 26, 46, 0.12);
    }

    .eyebrow {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .title-line {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .daisy {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .daisy svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .title {
      flex: 1;
      font-family: var(--logo);
      font-style: italic;
      font-weight: 700;
      font-size: 24px;
      line-height: 1.25;
      color: var(--navy);
      letter-spacing: -0.02em;
    }

    .details {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-start;
    }

    .description {
      font-size: 15px;
      line-height: 22px;
      color: var(--gray);
      text-align: left;
    }

    .meta {
      font-size: 13px;
      line-height: 18px;
      color: var(--muted);
      text-align: left;
    }

    .body {
      flex: 1;
      padding: 18px 16px 12px;
    }

    .section-label {
      margin-bottom: 10px;
      font-size: 11px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .step-card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(26, 26, 46, 0.04);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .step-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(26, 26, 46, 0.07);
    }

    .step-main {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 14px;
    }

    .step-badge {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      margin-top: 1px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--navy);
    }

    .step-copy { flex: 1; min-width: 0; }

    .step-name {
      font-size: 16px;
      font-weight: 500;
      line-height: 1.35;
      color: var(--navy);
    }

    .step-note {
      margin-top: 4px;
      font-size: 14px;
      line-height: 20px;
      color: var(--muted);
    }

    .step-meta {
      margin-top: 4px;
      font-size: 13px;
      color: var(--muted);
    }

    .step-product {
      margin-top: 5px;
      font-size: 13px;
      color: var(--blue);
    }

    .footer {
      padding: 12px 16px 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cta {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px 18px;
      background: var(--navy);
      color: var(--white);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(26, 26, 46, 0.18);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .cta:hover {
      opacity: 0.94;
      transform: translateY(-1px);
    }

    .hint {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      line-height: 18px;
    }

    .state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 56px 28px;
      text-align: center;
      gap: 12px;
    }

    .state h1 {
      font-family: var(--logo);
      font-style: italic;
      font-weight: 700;
      font-size: 22px;
      color: var(--navy);
    }

    .state p {
      font-size: 15px;
      line-height: 22px;
      color: var(--gray);
      max-width: 300px;
    }

    .hidden { display: none !important; }

    @media (min-width: 560px) {
      body { padding: 40px 20px; }
      .shell {
        margin: 0 auto;
        min-height: auto;
      }
    }

    @media (max-width: 479px) {
      body { background: var(--bg); }
      .atmosphere { opacity: 0.7; }
      .shell {
        width: 100%;
        margin: 0;
        min-height: 100vh;
        border: none;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="shell" id="shell">
    <div class="brand-bar">
      <span class="brand-mark" id="brand-mark" aria-hidden="true"></span>
      <a href="/">flowr</a>
    </div>

    <div id="loading" class="state">
      <p>Loading routine…</p>
    </div>

    <div id="error" class="state hidden">
      <h1>Routine unavailable</h1>
      <p>This share link may be out of date, or the routine was removed.</p>
      <a class="cta" style="width:auto;padding-inline:20px;margin-top:8px" href="https://apps.apple.com/us/app/flowr-self-care-planner/id6777282497">Get flowr</a>
    </div>

    <div id="content" class="hidden">
      <header class="header">
        <p class="eyebrow" id="eyebrow">Shared with you on flowr</p>
        <div class="title-line">
          <div class="daisy" id="daisy" aria-hidden="true"></div>
          <h1 class="title" id="routine-name"></h1>
        </div>
        <div class="details">
          <p class="description hidden" id="routine-description"></p>
          <p class="meta" id="routine-meta"></p>
        </div>
      </header>

      <div class="body">
        <p class="section-label">Steps</p>
        <div class="steps" id="steps"></div>
      </div>

      <div class="footer">
        <a
          class="cta"
          id="cta"
          href="https://apps.apple.com/us/app/flowr-self-care-planner/id6777282497"
        >Add to My Routines</a>
        <p class="hint">Open this link in flowr to add the routine to yours.</p>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var APP_STORE =
        (window.FLOWR_CONFIG && window.FLOWR_CONFIG.appStoreUrl) ||
        'https://apps.apple.com/us/app/flowr-self-care-planner/id6777282497';

      var CATEGORY_COLORS = {
        Skincare: '#e8a0b0',
        'Body Care': '#f0c0d0',
        'Hair Care': '#c0b0d8',
        'Nail Care': '#c4a8b8',
        'Oral Care': '#c4d4b8',
        Supplements: '#9eb0d4',
        Medications: '#b0c8e0',
        Exercise: '#ecb090',
        Wellness: '#9cb088',
        Other: '#e8d4a8',
      };

      var cta = document.getElementById('cta');
      if (cta) cta.href = APP_STORE;

      function show(id) {
        ['loading', 'error', 'content'].forEach(function (key) {
          document.getElementById(key).classList.toggle('hidden', key !== id);
        });
      }

      function daisySvg(color) {
        return (
          '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
          '<circle cx="12" cy="12" r="3" stroke="' + color + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>' +
          '<path d="M12 16.5A4.5 4.5 0 1 1 7.5 12 4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 1 1 4.5 4.5 4.5 4.5 0 1 1-4.5 4.5" stroke="' + color + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>' +
          '<path d="M12 7.5V9M7.5 12H9M16.5 12H15M12 16.5V15M8 8l1.88 1.88M14.12 9.88 16 8M8 16l1.88-1.88M14.12 14.12 16 16" stroke="' + color + '" stroke-width="1.5" stroke-linecap="round"/>' +
          '</svg>'
        );
      }

      function formatFrequency(frequency) {
        switch (frequency) {
          case 'daily': return 'Every day';
          case 'weekly': return 'Weekly';
          case 'biweekly': return 'Every 2 weeks';
          case 'monthly': return 'Monthly';
          case 'custom': return 'Custom';
          case 'cycle': return 'Cycle Phase';
          default: return frequency || '';
        }
      }

      function formatTimeOfDay(timeOfDay) {
        if (!timeOfDay) return '';
        return timeOfDay.charAt(0).toUpperCase() + timeOfDay.slice(1);
      }

      function formatSchedule(schedule) {
        if (!schedule) return '';
        var parts = [];
        if (schedule.frequency === 'custom') {
          parts.push('Every ' + (schedule.customIntervalDays || 3) + ' days');
        } else {
          parts.push(formatFrequency(schedule.frequency));
        }
        if (schedule.timeOfDay) parts.push(formatTimeOfDay(schedule.timeOfDay));
        return parts.filter(Boolean).join(' · ');
      }

      function productLabel(product) {
        if (!product) return '';
        var brand = (product.brand || '').trim();
        var name = (product.name || '').trim();
        if (brand && name) return brand + ' · ' + name;
        return brand || name;
      }

      function shareIdFromUrl() {
        var params = new URLSearchParams(window.location.search);
        var fromQuery = params.get('id');
        if (fromQuery && /^[0-9a-f-]{36}$/i.test(fromQuery)) return fromQuery;
        var match = window.location.pathname.match(/\/routine\/([0-9a-f-]{36})\/?$/i);
        return match ? match[1] : null;
      }

      function formatSharedTitle(snapshot) {
        var name = (snapshot && snapshot.name ? String(snapshot.name) : '').trim() || 'Routine';
        var person = (snapshot && snapshot.sharedByFirstName
          ? String(snapshot.sharedByFirstName)
          : '').trim();
        if (!person) return name;
        return person + "'s " + name;
      }

      function formatSharedDescription(snapshot) {
        var steps = snapshot && Array.isArray(snapshot.steps) ? snapshot.steps : [];
        var stepLabel = steps.length + (steps.length === 1 ? ' step' : ' steps');
        var schedule = (snapshot && snapshot.schedule) || {};
        var frequency =
          schedule.frequency === 'custom'
            ? 'Every ' + (schedule.customIntervalDays || 3) + ' days'
            : formatFrequency(schedule.frequency);
        var timeOfDay = formatTimeOfDay(schedule.timeOfDay || (snapshot && snapshot.timeOfDay));
        return [stepLabel, frequency, timeOfDay].filter(Boolean).join(' · ');
      }

      function setMeta(selector, attr, value) {
        var el = document.querySelector(selector);
        if (el) el.setAttribute(attr, value);
      }

      function setPageTitle(title, description) {
        document.title = title + ' — flowr';
        setMeta('meta[property="og:title"]', 'content', title);
        setMeta('meta[name="twitter:title"]', 'content', title);
        if (description) {
          setMeta('meta[name="description"]', 'content', description);
          setMeta('meta[property="og:description"]', 'content', description);
          setMeta('meta[name="twitter:description"]', 'content', description);
        }
      }

      function render(snapshot) {
        var title = formatSharedTitle(snapshot);
        var socialDescription = formatSharedDescription(snapshot);
        document.getElementById('routine-name').textContent = snapshot.name || title;
        setPageTitle(title, socialDescription);

        var person = (snapshot.sharedByFirstName || '').trim();
        document.getElementById('eyebrow').textContent = person
          ? 'Shared by ' + person
          : 'Shared with you on flowr';

        var color = CATEGORY_COLORS[snapshot.category] || CATEGORY_COLORS.Other;
        document.documentElement.style.setProperty('--accent', color);
        document.getElementById('daisy').innerHTML = daisySvg(color);
        var brandMark = document.getElementById('brand-mark');
        if (brandMark) brandMark.innerHTML = daisySvg(color);

        var descriptionEl = document.getElementById('routine-description');
        if (snapshot.description) {
          descriptionEl.textContent = snapshot.description;
          descriptionEl.classList.remove('hidden');
        }

        var steps = Array.isArray(snapshot.steps) ? snapshot.steps : [];
        var timeOfDay = formatTimeOfDay(
          (snapshot.schedule && snapshot.schedule.timeOfDay) || snapshot.timeOfDay,
        );
        var frequency =
          snapshot.schedule && snapshot.schedule.frequency === 'custom'
            ? 'Every ' + (snapshot.schedule.customIntervalDays || 3) + ' days'
            : formatFrequency(snapshot.schedule && snapshot.schedule.frequency);

        var metaParts = [
          snapshot.category,
          steps.length + (steps.length === 1 ? ' step' : ' steps'),
          frequency,
          timeOfDay,
        ].filter(Boolean);
        document.getElementById('routine-meta').textContent = metaParts.join(' · ');

        var stepsEl = document.getElementById('steps');
        stepsEl.innerHTML = '';
        steps.forEach(function (step, index) {
          var card = document.createElement('div');
          card.className = 'step-card';

          var main = document.createElement('div');
          main.className = 'step-main';

          var badge = document.createElement('div');
          badge.className = 'step-badge';
          badge.textContent = String(index + 1);

          var copy = document.createElement('div');
          copy.className = 'step-copy';

          var nameEl = document.createElement('div');
          nameEl.className = 'step-name';
          nameEl.textContent = step.name || 'Step';
          copy.appendChild(nameEl);

          if (step.note) {
            var noteEl = document.createElement('div');
            noteEl.className = 'step-note';
            noteEl.textContent = step.note;
            copy.appendChild(noteEl);
          }

          if (step.schedule) {
            var scheduleEl = document.createElement('div');
            scheduleEl.className = 'step-meta';
            scheduleEl.textContent = formatSchedule(step.schedule);
            copy.appendChild(scheduleEl);
          }

          var label = productLabel(step.product);
          if (label) {
            var productEl = document.createElement('div');
            productEl.className = 'step-product';
            productEl.textContent = label;
            copy.appendChild(productEl);
          }

          main.appendChild(badge);
          main.appendChild(copy);
          card.appendChild(main);
          stepsEl.appendChild(card);
        });

        show('content');
      }

      async function load() {
        var shareId = shareIdFromUrl();
        if (!shareId) {
          show('error');
          return;
        }

        var config = window.FLOWR_CONFIG || {};
        if (!config.supabaseUrl || !config.supabaseAnonKey) {
          console.error('Missing FLOWR_CONFIG.supabaseUrl / supabaseAnonKey in /config.js');
          show('error');
          return;
        }

        try {
          var endpoint =
            config.supabaseUrl.replace(/\/$/, '') +
            '/rest/v1/shared_routines?id=eq.' +
            encodeURIComponent(shareId) +
            '&select=snapshot';

          var response = await fetch(endpoint, {
            headers: {
              apikey: config.supabaseAnonKey,
              Authorization: 'Bearer ' + config.supabaseAnonKey,
              Accept: 'application/json',
            },
          });

          if (!response.ok) {
            show('error');
            return;
          }

          var rows = await response.json();
          if (!rows || !rows.length || !rows[0].snapshot) {
            show('error');
            return;
          }

          render(rows[0].snapshot);
        } catch (err) {
          console.error(err);
          show('error');
        }
      }

      load();
    })();
  </script>
</body>
</html>
